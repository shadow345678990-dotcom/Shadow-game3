```yaml
name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unzip the game (untouched)
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Using $ZIP"
          mkdir game
          unzip -q "$ZIP" -d game
          PKG=$(find game -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n1)
          echo "GAME_DIR=$(dirname "$PKG")" >> "$GITHUB_ENV"

      - name: Install and build the web game
        working-directory: ${{ env.GAME_DIR }}
        run: |
          npm install
          npm run build

      - name: Add Capacitor (Android wrapper)
        working-directory: ${{ env.GAME_DIR }}
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shadow.shooter",
            "appName": "Shadow Shooter",
            "webDir": "dist"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.GAME_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shadow-game-apk
          path: ${{ env.GAME_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
```
